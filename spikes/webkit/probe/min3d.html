<!doctype html><meta charset="utf-8"><title>min3d</title>
<style>html,body{margin:0;background:#fff}
.p{position:absolute;left:100px;top:100px;width:300px;height:300px;perspective:800px}
.t{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(58deg)}
.a{position:absolute;inset:0;background:red}.b{position:absolute;inset:0;background:rgba(0,0,255,.5);transform:translateZ(150px)}
</style>
<div class="p"><div class="t"><div class="a"></div><div class="b"></div></div></div>
<p style="position:absolute;left:100px;top:450px;font:20px system-ui">Blue plane should float above (and up from) the red one if 3D is rendered.</p>
