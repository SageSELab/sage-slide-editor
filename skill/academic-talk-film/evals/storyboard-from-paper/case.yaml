schema_version: "1.1"
name: storyboard-from-paper
expected_outcome: |
  A talk-eval/ folder is a sage-talk/1 talk folder scaffolded with scripts/new-talk.sh: talk.json (the spine,
  with "materials" pointing at the paper and package), scenes/*.html, beats/<chapter>.js with Talk.beat
  registrations at beat-relative times, lib/, theme.css, assets/; no hand-written index.html with absolute times
  or cp() holds. PLAN.md holds a chapter-by-chapter storyboard where every hold has a chapter.beat id, its motion
  time, and bracketed data sources taken from the paper and the package's CSVs (real numbers such as 50 real
  bugs, 46 synthetic bugs, five tools, 3,049 patches). The title beat uses the real author list in order with
  Kevin Moran bold, and the first chapter is built as beats with explicit "hold" values and notes (a continuous
  animated chapter, no bullet lists). `talkc validate --render` reports no errors, `talkc build` succeeds, and
  the holds were checked with `talkc shoot` frames that were actually looked at. No venue is named for any
  follow-up or under-review work.
