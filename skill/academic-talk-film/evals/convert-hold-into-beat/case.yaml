schema_version: "1.1"
name: convert-hold-into-beat
expected_outcome: |
  In the copy at /tmp/talk-eval4 the hand-written hold becomes one beat: talk.json gains a beat in chapter
  "claim" right after "claim" (for example {"id": "number", "label": "The number", "notes": "Eleven of fifty.",
  "hold": 3}), its hold converted from the absolute cp() times as 6.0 + 6.0 - (6.0 + 3.0) = 3 s after the
  previous hold; beats/claim.js gains Talk.beat('claim.<id>', ...) with the motion at beat-relative times
  (B.in('#c2-stat', 0.2, ...) and B.count('#c2-n', 0.3, 1.3, 11)), with no absolute times, no cp() call, no
  chapter constant and no B.at or B.T. #c2-stat is added to the B.out at t = 0 of omt.omt (and of the public end
  card's beat). `talkc validate --render` reports 0 errors and 0 warnings; `talkc layout` shows "The number" at
  11.0 and every later hold 3 s later than before; frames at the new hold (11 of 50 visible) and at "One more
  thing" (the number gone) were checked with talkc shoot. The original fixture folder is unchanged.
